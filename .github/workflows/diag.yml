name: Yahoo Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [diag]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: TWSE/TPEx reachability (follow redirects, DNS check)
      run: |
        UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
        echo "=== DNS resolution ==="
        for h in www.twse.com.tw twse.com.tw www.tpexweb.com.tw tpexweb.com.tw; do
          ip=$(getent hosts "$h" 2>/dev/null | awk '{print $1}' | head -1)
          echo "DNS $h -> ${ip:-FAIL}"
        done
        probe() {
          local label="$1" url="$2"
          local meta
          meta=$(curl -sL --max-time 25 -A "$UA" -o /tmp/b -w "code=%{http_code} final=%{url_effective} size=%{size_download}" "$url" 2>&1) || meta="CURL_FAIL rc=$? $meta"
          local snippet=$(head -c 160 /tmp/b 2>/dev/null | tr '\n' ' ')
          echo "PROBE ${label} :: ${meta}"
          echo "    body: ${snippet}"
        }
        echo "=== TWSE (listed official) ==="
        probe "TWSE 2330 daily"  "https://www.twse.com.tw/exchangeView/STOCK_DAY?stockCode=2330&date=2026092400"
        probe "TWSE 3071 daily"  "https://www.twse.com.tw/exchangeView/STOCK_DAY?stockCode=3071&date=2026092400"
        echo "=== TPEx (OTC official) ==="
        probe "TPEx home"        "https://www.tpexweb.com.tw/"
        echo "=== control: Yahoo (expect 429) ==="
        probe "Yahoo 2330"       "https://query1.finance.yahoo.com/v8/finance/chart/2330.TW?range=5d&interval=1d"
