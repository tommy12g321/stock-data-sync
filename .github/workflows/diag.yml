name: Yahoo Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [diag]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install twstock requests
    - name: Probe official TWSE/TPEx historical fetchers (range + reachability)
      run: |
        python - <<'PY'
        import warnings; warnings.filterwarnings("ignore")
        from twstock.stock import TWSEFetcher, TPEXFetcher
        def show(label, data):
            rows = data.get("data", [])
            if rows:
                print(f"{label} -> {len(rows)} rows | {rows[0].date.date()} .. {rows[-1].date.date()} | close_last={rows[-1].close}")
            else:
                print(f"{label} -> 0 rows (empty/blocked?)")
        t = TWSEFetcher(); p = TPEXFetcher()
        print("=== TWSE (listed) ===")
        show("TWSE 2330 d=202001", t.fetch(2020,1,"2330"))
        show("TWSE 2330 d=202609", t.fetch(2026,9,"2330"))
        show("TWSE 3071 d=202609 (was 404 on Yahoo)", t.fetch(2026,9,"3071"))
        print("=== TPEx (OTC) ===")
        show("TPEx 1240 d=202001", p.fetch(2020,1,"1240"))
        show("TPEx 1240 d=202609", p.fetch(2026,9,"1240"))
        show("TPEx 1101 d=202609", p.fetch(2026,9,"1101"))
        PY
