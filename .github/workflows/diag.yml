name: Yahoo Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [diag]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Reachability of official TW sources from Actions
      run: |
        UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
        probe() {
          local label="$1" url="$2"
          local code body
          body=$(curl -s --max-time 25 -A "$UA" -D /tmp/h -o /tmp/b -w "%{http_code}" "$url" 2>&1)
          code=$(echo "$body" | tail -1)
          local size=$(wc -c < /tmp/b 2>/dev/null || echo 0)
          local snippet=$(head -c 150 /tmp/b 2>/dev/null | tr '\n' ' ')
          echo "PROBE ${label} -> HTTP ${code} (${size}b) :: ${snippet}"
        }
        echo "=== TWSE (listed official) ==="
        probe "TWSE 2330 daily"  "https://www.twse.com.tw/exchangeView/STOCK_DAY?stockCode=2330&date=2026092400"
        probe "TWSE 3071 daily"  "https://www.twse.com.tw/exchangeView/STOCK_DAY?stockCode=3071&date=2026092400"
        echo "=== TPEx (OTC official) ==="
        probe "TPEx home"        "https://www.tpexweb.com.tw/"
        probe "TPEx 1240 quote"  "https://www.tpexweb.com.tw/StockQuote/StockQuote.aspx?StockId="
        echo "=== control: Yahoo (expect 429) ==="
        probe "Yahoo 2330"       "https://query1.finance.yahoo.com/v8/finance/chart/2330.TW?range=5d&interval=1d"
