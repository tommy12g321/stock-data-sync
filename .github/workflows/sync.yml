name: Daily Stock Sync

on:
  schedule:
    - cron: '30 17 * * *' # 01:30 台灣時間(收盤翌日凌晨,數據定案;落在快網時段內)
  push:
    branches: [ main ]
  workflow_dispatch:   # Allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas twstock

    - name: Refresh full symbol list (上市+上櫃+特別股+創新板)
      run: python build_symbols.py

    - name: Run fetch script
      run: python fetch_yahoo_data.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Action"
        git add data/*.csv symbols.txt || echo "Nothing to add"
        git commit -m "Auto-sync stock data: $(date +'%Y-%m-%d')" || echo "No changes to commit"
        git push
