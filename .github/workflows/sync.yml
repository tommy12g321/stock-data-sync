name: Daily Stock Sync

on:
  schedule:
    - cron: '0 8 * * *' # Runs every day at 8:00 UTC (approx 4 PM Taiwan time after market close)
  push:
    branches: [ main ]
  workflow_dispatch:   # Allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas

    - name: Run fetch script
      run: python fetch_yahoo_data.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Action"
        git add data/*.csv || echo "No CSV files found to add"
        git commit -m "Auto-sync stock data: $(date +'%Y-%m-%d')" || echo "No changes to commit"
        git push