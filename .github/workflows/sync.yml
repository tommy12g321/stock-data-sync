name: Daily Stock Sync

on:
  schedule:
    - cron: '30 17 * * *' # 01:30 台灣時間(收盤翌日凌晨,數據定案)
  push:
    branches: [ main ]
  workflow_dispatch:   # manual trigger from GitHub UI

# 避免重疊 run 搶著 push
concurrency:
  group: stock-sync
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      otc: ${{ steps.otc.outputs.otc }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install twstock
    - name: Refresh symbol list + split OTC into chunks
      id: otc
      run: |
        python build_symbols.py
        # 只挑「還沒檔」的上櫃股,單 run 限 480 檔(≈3.25h,穩壓在 6h job cap 內)→ 全量分 2 次收斂
        python make_otc_chunks.py --n 12 --max 480 --data data > otc_chunks.json
        echo "otc=$(cat otc_chunks.json)" >> "$GITHUB_OUTPUT"

  listed:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: |
        pip install --upgrade pip
        pip install yfinance pandas twstock
    - name: Fetch listed (TWSE) stocks via Yahoo
      run: |
        python build_symbols.py
        python fetch_yahoo_data.py --twse --data data --outdir out
    - name: Upload listed CSVs
      uses: actions/upload-artifact@v4
      with:
        name: listed
        path: out
        if-no-files-found: ignore

  index:
    # ^TWII 加權指數(單一符號、一次請求,與個股 job 平行)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install yfinance pandas
    - name: Fetch ^TWII weighted index via Yahoo
      run: python fetch_index.py --outdir out
    - name: Upload index CSV
      uses: actions/upload-artifact@v4
      with:
        name: index
        path: out
        if-no-files-found: ignore

  otc:
    needs: prep
    # 上櫃全回補完(無待補檔)→ 空 matrix,直接跳過
    if: ${{ needs.prep.outputs.otc != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 600   # 實際 job cap 6h;單 run 限 480 檔(≈3.25h)壓在 cap 內
    strategy:
      fail-fast: false
      matrix:
        spec: ${{ fromJson(needs.prep.outputs.otc) }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: |
        pip install --upgrade pip
        pip install pandas requests twstock
    - name: Fetch OTC (TPEx) chunk ${{ matrix.spec.i }} from official source
      run: |
        python build_symbols.py
        python fetch_tpex_data.py --symbols "${{ matrix.spec.s }}" --data data --outdir out
    - name: Upload OTC chunk CSVs
      uses: actions/upload-artifact@v4
      with:
        name: otc-${{ matrix.spec.i }}
        path: out
        if-no-files-found: ignore

  commit:
    needs: [listed, otc, index]
    # 部分 chunk 失敗不能擋住提交:只要沒被 cancel,就 commit 所有已抓到的(成功 chunk 的 artifact 仍在)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Download all fetched CSVs
      uses: actions/download-artifact@v4
      continue-on-error: true   # 極端全失敗(無 artifact)也不該擋 commit
      with:
        path: stage             # 不設 pattern → 抓全部 artifact,名稱碰撞/字串匹配都不會漏
    - name: Assemble data/ and commit
      run: |
        set -euo pipefail
        mkdir -p data stage     # stage 預建,避免無 artifact 時 find 找不到目錄而中斷
        # stage/<artifact>/*.csv 都是已合併的完整 CSV,直接覆蓋進 data/
        find stage -name '*.csv' -exec cp -f {} data/ \;
        echo "CSV 數量: $(find data -name '*.csv' | wc -l)"
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Action"
        # 以「最新 main」為基準提交:並發 push(手動改檔/其他排程 run)不會造成 non-fast-forward;
        # data 是完整快照、覆寫幂等,reset --soft 換基準不丟資料
        git fetch origin main
        git reset --soft origin/main
        git add data/ symbols.txt
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto-sync stock data: $(date +'%Y-%m-%d')"
          git push
        fi
